<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        h2 {
            color: #2563eb;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        ul {
            padding-left: 25px;
        }

        li {
            margin: 10px 0;
        }

        .nombre {
            text-align: center;
            font-size: 20px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Mi Perfil</h1>

        <!-- Nombre -->
        <section>
            <h2>Nombre</h2>
            <p class="nombre">{{ nombre }}</p>
        </section>

        <!-- Apellidos -->
        <section>
            <h2>Apellidos</h2>

            <p>
                <strong>Primer apellido:</strong>
                {{ apellidos.primero }}
            </p>

            <p>
                <strong>Segundo apellido:</strong>
                {{ apellidos.segundo }}
            </p>
        </section>

        <!-- Asignaturas -->
        <section>
            <h2>Asignaturas</h2>

            <ul>
                {% for asignatura in asignaturas %}
                    <li>{{ asignatura }}</li>
                {% endfor %}
            </ul>
        </section>

        <!-- Hobbies -->
        <section>
            <h2>Hobbies</h2>

            <ul>
                {% for hobby in hobbies %}
                    <li>{{ hobby }}</li>
                {% endfor %}
            </ul>
        </section>

    </div>

</body>
</html>
